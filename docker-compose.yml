version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY:-clau_secreta_servidor_recursos_v03}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt_clau_servidor_recursos_v03}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@mme.cat}
      - MAGIC_CODE=${MAGIC_CODE:-123456}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
